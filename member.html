<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Become a Member – Gym Pro</title>
  <style>
    body {
      background: url('https://t3.ftcdn.net/jpg/05/79/96/42/360_F_579964274_IXfgpEBUCGcCwbOcvK4PWGJXkHwlmPT7.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: whitesmoke;
      font-family: Arial, sans-serif;
    }

    .box {
      max-width: 600px;
      margin: 150px auto;
      background: rgba(0, 0, 0, 0.7);
      box-shadow: grey; /* golden glow */
      border-radius: 15px;
      padding: 40px;
    }

    h1 {
      text-align: center;
      font-size: 34px;
      margin-bottom: 10px;
      color: white;
    }

    p {
      font-size: 17px;
      text-align: center;
      margin-bottom: 25px;
      color: #ccc;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input, select {
      background-color: rgba(0, 0, 0, 0.6);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
    }

    option {
      background-color: black;
      color: white;
    }

    button {
      background:linear-gradient(to right, black, grey);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #d4af37;
    }
       .my-footer {
  text-align: center;
  padding: 15px 0;
  background-color: rgba(0, 0, 0, 0.6);
  color: whitesmoke;
  font-size: 14px;
  max-width: 400px;
  margin: 100px auto 0; /* Top margin + horizontal centering */
}
  </style>
</head>
<body>
  <div class="box">
    <h1>Membership Open – Your New Body Awaits</h1>
    <p>From raw potential to elite transformation — this is your commitment to become unstoppable.</p>
    <form id="joinForm">
      <input type="text" name="name" placeholder="Your Full Name" required>
      <input type="email" name="email" placeholder="Email Address" required>

      <select name="membership" required>
        <option value="" disabled selected>Select Membership Type</option>
        <option value="standard">Standard Access</option>
        <option value="pro">Pro Athlete Package</option>
        <option value="vip">VIP Elite Experience</option>
      </select>

      <button type="submit">Become a Member</button>
    </form>
   <div id="thankYou" style="display: none; text-align: center; margin-top: 20px;">
      <h2>✅ Thank you for becoming a Member of IronCore Fitness!</h2>
      <p>We’ll contact you soon with more details.</p>
    </div>
  </div>
</div>
  <footer class="my-footer">
    <p>Made with ❤️ by Umer Maqsood</p>
    <p>© 2025 All rights reserved</p>
  </footer>
  <script>
    // JavaScript: show thank you message instead of new page
    document.getElementById("joinForm").addEventListener("submit", function(event) {
      event.preventDefault(); // stop default page reload
      this.style.display = "none"; // hide form
      document.getElementById("thankYou").style.display = "block"; // show message
    });
  </script>
</body>
</html>
