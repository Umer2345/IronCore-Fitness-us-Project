<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gym Web Page</title>
  </head>
<body>
  <div class="box">
    <h1>Sign Up Today – Create Your Fitness Account</h1>
    <p>Fill in the details below and take the first step to get a free trial, and become healthier, stronger.</p>
    <form>
      <input type="text" name="name" placeholder="Full Name" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="confirm password" placeholder="Password" required>

      <select name="gender" required>
        <option value="" disabled selected>Select Gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
      </select>

      <select name="fitness level" required>
        <option value="" disabled selected>Select Fitness Level</option>
        <option value="beginner">Beginner</option>
        <option value="intermediate">Intermediate</option>
        <option value="advanced">Advanced</option>
      </select>
      <button type="submit">Sign Up</button>
    </form>
  </div>
   <footer class="my-footer">
    <p>Made with ❤️ by Umer Maqsood</p>
    <p>© 2025 All rights reserved</p>
  </footer>
</body>
  <style>
    body {
      background: url('https://t3.ftcdn.net/jpg/05/79/96/42/360_F_579964274_IXfgpEBUCGcCwbOcvK4PWGJXkHwlmPT7.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: whitesmoke;
      font-family: Arial, sans-serif;
    }

    .box {
      max-width: 600px;
      margin: 150px auto;
      background: rgba(0, 0, 0, 0.6);
      box-shadow: 0 0 15px rgba(0,0,0,0.7);
      border-radius: 15px;
      padding: 40px;
    }

    h1 {
      text-align: center;
      font-size: 40px;
    }

    p {
      font-size: 18px;
      text-align: center;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input,
    select {
      background-color: rgba(0, 0, 0, 0.6);
      color: white;
      border: none;
      padding: 20px;
      border-radius: 8px;
      font-size: 16px;
    }

    option {
      background-color: black; /* Might not show in Chrome */
      color: white;
    }

    button {
      background: linear-gradient(to right, black, grey);
      color: white;
      padding: 12px;
      font-size: 18px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: scale(1.05);
      background: dark grey;
    }
    .my-footer {
  text-align: center;
  padding: 15px 0;
  background-color: rgba(0, 0, 0, 0.6);
  color: whitesmoke;
  font-size: 14px;
  max-width: 400px;
  margin: 100px auto 0; /* Top margin + horizontal centering */
}
</style>

</html>
